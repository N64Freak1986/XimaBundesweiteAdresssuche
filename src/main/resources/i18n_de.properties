plugin.servlet.description=Adresssuche: serverseitiger Zugriff auf den Ortssuchdienst Bayern (API-Key bleibt auf dem Server).
plugin.resource.description=Adresssuche: Formular-Ressource hybrid-address-search.js (Bayern Ortssuchdienst + OpenPLZ).
plugin.prerender.description=Adresssuche: stellt Servlet-URL und Ortsbeschränkungen für hybrid-address-search.js bereit.
bundle.prop.bayernApiKey=API-Key für den Ortssuchdienst Bayern (geoservices.bayern.de). Bleibt auf dem Server; ohne Key nur OpenPLZ.
bundle.prop.restrictions=Ortsbeschränkungen: css-klasse=Name|Suchzusatz|PLZ,PLZ (mehrere mit ; trennen, - = keine)
bundle.prop.rateLimit=Maximale Suchanfragen pro Minute und Besucher (10 bis 10000)
bundle.prop.debug=Debug-Ausgaben in der Browser-Konsole (true/false)
bundle.prop.globalRateLimit=Maximale Suchanfragen pro Minute für alle Besucher zusammen (100 bis 100000)
