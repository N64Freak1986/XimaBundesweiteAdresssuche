plugin.servlet.description=Address search: server-side access to the Bavarian location search service (API key stays on the server).
plugin.resource.description=Address search: form resource hybrid-address-search.js (Bavarian location search + OpenPLZ).
plugin.prerender.description=Address search: provides servlet URL and location restrictions for hybrid-address-search.js.
bundle.prop.bayernApiKey=API key for the Bavarian location search service (geoservices.bayern.de). Stays on the server; without a key only OpenPLZ is used.
bundle.prop.restrictions=Location restrictions: css-class=Name|search suffix|ZIP,ZIP (separate entries with ;, - = none)
bundle.prop.rateLimit=Maximum search requests per minute and visitor (10 to 10000)
bundle.prop.debug=Debug output in the browser console (true/false)
bundle.prop.globalRateLimit=Maximum search requests per minute for all visitors combined (100 to 100000)
